<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VT</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --red:#ff4655;--bg:#0f1923;--bg2:#1a2634;--bg3:#243447;
      --text:#ece8e1;--muted:#768079;--border:rgba(255,70,85,0.18);
      --green:#4ade80;--yellow:#f59e0b;--blue:#38bdf8;
    }
    body{background:var(--bg);color:var(--text);font-family:'Noto Sans KR',sans-serif;min-height:100vh;}
    body::before{
      content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
      background-image:
        repeating-linear-gradient(0deg,transparent,transparent 60px,rgba(255,70,85,0.022) 60px,rgba(255,70,85,0.022) 61px),
        repeating-linear-gradient(90deg,transparent,transparent 60px,rgba(255,70,85,0.022) 60px,rgba(255,70,85,0.022) 61px);
    }

    /* ── 상단 네비 ── */
    .topbar{
      position:sticky;top:0;z-index:50;
      background:rgba(15,25,35,0.95);backdrop-filter:blur(12px);
      border-bottom:1px solid var(--border);
      display:flex;align-items:center;gap:0;height:58px;padding:0 32px;
    }
    .logo{font-family:'Rajdhani',sans-serif;font-size:26px;font-weight:700;letter-spacing:4px;margin-right:40px;}
    .logo span{color:var(--red);}
    .nav-tabs{display:flex;gap:4px;flex:1;}
    .nav-tab{
      background:none;border:none;color:var(--muted);cursor:pointer;
      font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;
      padding:8px 18px;border-radius:3px;transition:all 0.2s;letter-spacing:0.5px;
      white-space:nowrap;
    }
    .nav-tab:hover{color:var(--text);background:var(--bg2);}
    .nav-tab.active{color:var(--text);background:var(--bg2);border-bottom:2px solid var(--red);}

    /* ── 공통 ── */
    .page{display:none;position:relative;z-index:1;padding:32px;max-width:1200px;margin:0 auto;}
    .page.active{display:block;}
    .section-title{
      font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:700;
      letter-spacing:3px;color:var(--muted);text-transform:uppercase;
      margin-bottom:18px;display:flex;align-items:center;gap:10px;
    }
    .section-title::after{content:'';flex:1;height:1px;background:var(--border);}

    /* ── 각독각폭 페이지 ── */
    .map-select-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:28px;}
    .map-chip{
      background:var(--bg2);border:1px solid var(--border);border-radius:3px;
      color:var(--muted);cursor:pointer;font-size:12px;letter-spacing:1px;
      padding:7px 16px;transition:all 0.2s;white-space:nowrap;
    }
    .map-chip:hover{border-color:var(--red);color:var(--text);}
    .map-chip.active{background:var(--red);border-color:var(--red);color:#fff;font-weight:700;}

    .lineup-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
    .lineup-card{
      background:var(--bg2);border:1px solid var(--border);border-radius:6px;
      overflow:hidden;
    }
    .lineup-card-header{
      padding:14px 20px;display:flex;align-items:center;gap:12px;
      border-bottom:1px solid var(--border);
    }
    .agent-icon{
      width:36px;height:36px;border-radius:50%;
      background:var(--bg3);display:flex;align-items:center;justify-content:center;
      font-size:18px;flex-shrink:0;
    }
    .lineup-card-header h3{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;letter-spacing:2px;}
    .lineup-card-header span{font-size:11px;color:var(--muted);letter-spacing:1px;}
    .lineup-body{padding:16px 20px;display:flex;flex-direction:column;gap:10px;}

    .lineup-item{
      background:var(--bg3);border-radius:4px;padding:12px 16px;
      border-left:3px solid var(--red);
    }
    .lineup-item-title{font-size:12px;font-weight:700;letter-spacing:1px;margin-bottom:4px;color:var(--text);}
    .lineup-item-desc{font-size:11px;color:var(--muted);line-height:1.7;}
    .lineup-item-tip{
      display:inline-block;margin-top:6px;
      background:rgba(255,70,85,0.12);color:var(--red);
      font-size:10px;letter-spacing:1px;padding:2px 8px;border-radius:2px;
    }

    .map-img-wrap{
      width:100%;height:200px;overflow:hidden;
      border-bottom:1px solid var(--border);position:relative;
    }
    .map-img-wrap img{width:100%;height:100%;object-fit:cover;filter:brightness(0.6);}
    .map-img-wrap .map-name-overlay{
      position:absolute;bottom:12px;left:16px;
      font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;
      letter-spacing:4px;color:#fff;text-shadow:0 2px 8px rgba(0,0,0,0.8);
    }

    /* ── 추천 조합 페이지 ── */
    .comp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;}
    .comp-card{
      background:var(--bg2);border:1px solid var(--border);border-radius:6px;
      overflow:hidden;transition:border-color 0.2s;
    }
    .comp-card:hover{border-color:rgba(255,70,85,0.4);}
    .comp-map-header{
      height:100px;position:relative;overflow:hidden;
    }
    .comp-map-header img{width:100%;height:100%;object-fit:cover;filter:brightness(0.5);}
    .comp-map-header .comp-map-name{
      position:absolute;bottom:10px;left:14px;
      font-family:'Rajdhani',sans-serif;font-size:20px;font-weight:700;letter-spacing:3px;
    }
    .comp-body{padding:16px;}
    .comp-agents{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
    .agent-badge{
      display:flex;align-items:center;gap:5px;
      background:var(--bg3);border-radius:3px;padding:5px 10px;
      font-size:12px;font-weight:500;
    }
    .agent-badge .role{font-size:9px;color:var(--muted);letter-spacing:1px;}
    .comp-tip{font-size:11px;color:var(--muted);line-height:1.6;}
    .role-tag{
      font-size:9px;letter-spacing:1px;padding:2px 7px;border-radius:2px;
      text-transform:uppercase;
    }
    .role-tag.duelist{background:rgba(255,70,85,0.15);color:var(--red);}
    .role-tag.controller{background:rgba(56,189,248,0.15);color:var(--blue);}
    .role-tag.initiator{background:rgba(245,158,11,0.15);color:var(--yellow);}
    .role-tag.sentinel{background:rgba(74,222,128,0.15);color:var(--green);}

    /* ── 경쟁전 맵 페이지 ── */
    .ranked-maps-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
    .ranked-map-card{
      background:var(--bg2);border:1px solid var(--border);border-radius:6px;
      overflow:hidden;transition:border-color 0.2s,transform 0.2s;cursor:default;
    }
    .ranked-map-card:hover{border-color:rgba(255,70,85,0.5);transform:translateY(-2px);}
    .ranked-map-img{height:130px;position:relative;overflow:hidden;}
    .ranked-map-img img{width:100%;height:100%;object-fit:cover;filter:brightness(0.55);transition:filter 0.3s;}
    .ranked-map-card:hover .ranked-map-img img{filter:brightness(0.7);}
    .ranked-map-img .rmap-name{
      position:absolute;bottom:10px;left:12px;
      font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;letter-spacing:3px;
    }
    .ranked-map-img .rmap-location{
      position:absolute;top:8px;right:10px;
      font-size:9px;letter-spacing:2px;color:rgba(255,255,255,0.6);text-transform:uppercase;
    }
    .ranked-map-body{padding:12px 14px;}
    .ranked-map-body .rmap-desc{font-size:11px;color:var(--muted);line-height:1.6;margin-bottom:8px;}
    .rmap-tags{display:flex;gap:4px;flex-wrap:wrap;}
    .rmap-tag{
      font-size:9px;letter-spacing:1px;padding:2px 7px;border-radius:2px;
      background:var(--bg3);color:var(--muted);text-transform:uppercase;
    }

    /* ── 데일리 갤러리 ── */
    .daily-top{display:flex;gap:16px;margin-bottom:28px;}
    .daily-add-card{
      background:var(--bg2);border:1px solid var(--border);border-radius:6px;
      padding:24px;flex:1;max-width:380px;
    }
    .daily-add-card h3{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;letter-spacing:2px;margin-bottom:18px;}
    .form-row{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
    .form-label{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;}
    .form-input{
      background:var(--bg3);border:1px solid rgba(255,255,255,0.07);border-radius:2px;
      color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;
      padding:9px 12px;outline:none;transition:border-color 0.2s;width:100%;
    }
    .form-input:focus{border-color:var(--red);}
    .form-row-inline{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
    .result-btns{display:flex;gap:8px;margin-bottom:14px;}
    .result-btn{
      flex:1;background:var(--bg3);border:1px solid rgba(255,255,255,0.07);
      border-radius:2px;color:var(--muted);cursor:pointer;
      font-family:'Noto Sans KR',sans-serif;font-size:12px;
      padding:9px;transition:all 0.2s;
    }
    .result-btn:hover{border-color:var(--muted);}
    .result-btn.sel-win{background:rgba(74,222,128,0.15);border-color:var(--green);color:var(--green);font-weight:700;}
    .result-btn.sel-lose{background:rgba(255,70,85,0.15);border-color:var(--red);color:var(--red);font-weight:700;}
    .result-btn.sel-draw{background:rgba(118,128,121,0.2);border-color:var(--muted);color:var(--text);font-weight:700;}
    .add-btn{
      width:100%;background:var(--red);border:none;border-radius:2px;
      color:#fff;cursor:pointer;font-family:'Rajdhani',sans-serif;
      font-size:14px;font-weight:700;letter-spacing:2px;padding:11px;
      text-transform:uppercase;transition:background 0.2s;
    }
    .add-btn:hover{background:#e03a47;}

    /* 요약 */
    .daily-summary{
      background:var(--bg2);border:1px solid var(--border);border-radius:6px;
      padding:20px 24px;flex:1;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;align-content:start;
    }
    .sum-item{background:var(--bg3);border-radius:3px;padding:12px 14px;}
    .sum-label{font-size:9px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;}
    .sum-val{font-family:'Rajdhani',sans-serif;font-size:24px;font-weight:700;}

    /* 기록 목록 */
    .daily-list{display:flex;flex-direction:column;gap:8px;}
    .daily-entry{
      background:var(--bg2);border:1px solid var(--border);border-radius:4px;
      padding:14px 18px;display:grid;
      grid-template-columns:auto 1fr auto auto auto;
      align-items:center;gap:20px;
      transition:border-color 0.2s;
    }
    .daily-entry:hover{border-color:rgba(255,70,85,0.3);}
    .entry-bar{width:4px;height:36px;border-radius:2px;}
    .entry-bar.win{background:var(--green);}
    .entry-bar.lose{background:var(--red);}
    .entry-bar.draw{background:var(--muted);}
    .entry-date{font-size:12px;color:var(--muted);letter-spacing:0.5px;}
    .entry-result{font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;}
    .entry-result.win{color:var(--green);}
    .entry-result.lose{color:var(--red);}
    .entry-result.draw{color:var(--muted);}
    .entry-rr{font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:700;}
    .entry-rr.up{color:var(--green);}
    .entry-rr.down{color:var(--red);}
    .entry-note{font-size:12px;color:var(--muted);max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .entry-del{
      background:none;border:none;color:var(--muted);cursor:pointer;
      font-size:14px;padding:4px 8px;border-radius:2px;transition:all 0.2s;
    }
    .entry-del:hover{background:rgba(255,70,85,0.1);color:var(--red);}
    .empty-state{text-align:center;color:var(--muted);font-size:13px;padding:40px;letter-spacing:1px;}

    /* 차트 */
    .chart-wrap{
      background:var(--bg2);border:1px solid var(--border);border-radius:6px;
      padding:20px 24px;margin-bottom:24px;
    }
    .chart-title{font-size:11px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:16px;}
    canvas{width:100%!important;height:120px!important;}

    @media(max-width:900px){
      .lineup-grid,.comp-grid,.ranked-maps-grid{grid-template-columns:1fr;}
      .daily-top{flex-direction:column;}
      .topbar{padding:0 16px;}
      .page{padding:20px 16px;}
    }
  </style>
</head>
<body>

<!-- 상단 네비 -->
<div class="topbar">
  <div class="logo">V<span>T</span></div>
  <div class="nav-tabs">
    <button class="nav-tab active" onclick="showPage('lineup')">각독 · 각폭</button>
    <button class="nav-tab" onclick="showPage('comp')">추천 조합</button>
    <button class="nav-tab" onclick="showPage('ranked')">경쟁전 맵</button>
    <button class="nav-tab" onclick="showPage('daily')">데일리 갤러리</button>
  </div>
</div>

<!-- ══════════════════════════════
     1. 각독 · 각폭
══════════════════════════════ -->
<div class="page active" id="page-lineup">

  <div class="map-select-row" id="lineup-map-chips"></div>

  <div id="lineup-content"></div>

</div>

<!-- ══════════════════════════════
     2. 추천 조합
══════════════════════════════ -->
<div class="page" id="page-comp">
  <div class="section-title">맵별 추천 요원 조합</div>
  <div class="comp-grid" id="comp-grid"></div>
</div>

<!-- ══════════════════════════════
     3. 경쟁전 맵
══════════════════════════════ -->
<div class="page" id="page-ranked">
  <div class="section-title">현재 경쟁전 맵 풀 (에피소드 9)</div>
  <div class="ranked-maps-grid" id="ranked-maps-grid"></div>
</div>

<!-- ══════════════════════════════
     4. 데일리 갤러리
══════════════════════════════ -->
<div class="page" id="page-daily">

  <div class="daily-top">
    <!-- 입력 폼 -->
    <div class="daily-add-card">
      <h3>📝 오늘 기록 추가</h3>
      <div class="form-row">
        <div class="form-label">날짜</div>
        <input type="date" class="form-input" id="d-date">
      </div>
      <div class="form-row">
        <div class="form-label">결과</div>
        <div class="result-btns">
          <button class="result-btn" id="btn-win" onclick="selResult('win')">🟢 승리</button>
          <button class="result-btn" id="btn-lose" onclick="selResult('lose')">🔴 패배</button>
          <button class="result-btn" id="btn-draw" onclick="selResult('draw')">⚪ 무승부</button>
        </div>
      </div>
      <div class="form-row-inline" style="margin-bottom:10px;">
        <div>
          <div class="form-label">RR 변화</div>
          <input type="number" class="form-input" id="d-rr" placeholder="+20 or -15">
        </div>
        <div>
          <div class="form-label">현재 RR</div>
          <input type="number" class="form-input" id="d-current-rr" placeholder="예: 45">
        </div>
      </div>
      <div class="form-row" style="margin-bottom:14px;">
        <div class="form-label">메모 (선택)</div>
        <input type="text" class="form-input" id="d-note" placeholder="오늘 잘한 점, 못한 점...">
      </div>
      <button class="add-btn" onclick="addEntry()">기록 추가</button>
    </div>

    <!-- 요약 -->
    <div class="daily-summary">
      <div class="sum-item">
        <div class="sum-label">총 게임</div>
        <div class="sum-val" id="sum-total">0</div>
      </div>
      <div class="sum-item">
        <div class="sum-label">승률</div>
        <div class="sum-val" id="sum-wr" style="color:var(--green);">0%</div>
      </div>
      <div class="sum-item">
        <div class="sum-label">승 / 패</div>
        <div class="sum-val"><span style="color:var(--green)" id="sum-wins">0</span> / <span style="color:var(--red)" id="sum-losses">0</span></div>
      </div>
      <div class="sum-item">
        <div class="sum-label">총 RR 변화</div>
        <div class="sum-val" id="sum-rr">+0</div>
      </div>
    </div>
  </div>

  <!-- RR 차트 -->
  <div class="chart-wrap" id="chart-wrap" style="display:none;">
    <div class="chart-title">RR 변화 추이</div>
    <canvas id="rr-chart"></canvas>
  </div>

  <div class="section-title">기록 목록</div>
  <div class="daily-list" id="daily-list">
    <div class="empty-state">아직 기록이 없어요. 오늘 게임을 추가해보세요! 🎮</div>
  </div>

</div>

<script>

════════════════════════════ */

/* ════════════════════════════
   데일리 갤러리
════════════════════════════ */
let entries = [];
let selectedResult = '';

try { entries = JSON.parse(localStorage.getItem('vt_daily') || '[]'); } catch(e) { entries = []; }

function saveEntries() {
  try { localStorage.setItem('vt_daily', JSON.stringify(entries)); } catch(e) {}
}

function selResult(r) {
  selectedResult = r;
  ['win','lose','draw'].forEach(x => {
    document.getElementById('btn-' + x).className = 'result-btn' + (r===x?' sel-'+r:'');
  });
}

function addEntry() {
  const date = document.getElementById('d-date').value;
  const rr = parseInt(document.getElementById('d-rr').value) || 0;
  const currentRr = parseInt(document.getElementById('d-current-rr').value) || null;
  const note = document.getElementById('d-note').value.trim();

  if (!date) { alert('날짜를 선택해주세요!'); return; }
  if (!selectedResult) { alert('결과를 선택해주세요!'); return; }

  entries.unshift({ date, result: selectedResult, rr, currentRr, note, id: Date.now() });
  saveEntries();

  // 초기화
  document.getElementById('d-rr').value = '';
  document.getElementById('d-current-rr').value = '';
  document.getElementById('d-note').value = '';
  selectedResult = '';
  ['win','lose','draw'].forEach(x => document.getElementById('btn-' + x).className = 'result-btn');

  renderDaily();
}

function deleteEntry(id) {
  entries = entries.filter(e => e.id !== id);
  saveEntries();
  renderDaily();
}

function renderDaily() {
  // 요약
  const wins = entries.filter(e => e.result === 'win').length;
  const losses = entries.filter(e => e.result === 'lose').length;
  const total = entries.length;
  const wr = total > 0 ? ((wins/total)*100).toFixed(0) : 0;
  const totalRR = entries.reduce((s,e) => s + (e.rr||0), 0);

  document.getElementById('sum-total').textContent = total;
  document.getElementById('sum-wr').textContent = wr + '%';
  document.getElementById('sum-wins').textContent = wins;
  document.getElementById('sum-losses').textContent = losses;
  const rrEl = document.getElementById('sum-rr');
  rrEl.textContent = (totalRR >= 0 ? '+' : '') + totalRR;
  rrEl.style.color = totalRR >= 0 ? 'var(--green)' : 'var(--red)';

  // 차트
  const chartWrap = document.getElementById('chart-wrap');
  if (entries.length > 1) {
    chartWrap.style.display = 'block';
    drawChart();
  } else {
    chartWrap.style.display = 'none';
  }

  // 목록
  const list = document.getElementById('daily-list');
  if (entries.length === 0) {
    list.innerHTML = '<div class="empty-state">아직 기록이 없어요. 오늘 게임을 추가해보세요! 🎮</div>';
    return;
  }

  list.innerHTML = entries.map(e => {
    const resKor = e.result==='win'?'승리':e.result==='lose'?'패배':'무승부';
    const rrStr = e.rr >= 0 ? '+'+e.rr : e.rr;
    const rrClass = e.rr >= 0 ? 'up' : 'down';
    const dateObj = new Date(e.date);
    const dateStr = (dateObj.getMonth()+1) + '월 ' + dateObj.getDate() + '일';
    return `
      <div class="daily-entry">
        <div class="entry-bar ${e.result}"></div>
        <div>
          <div class="entry-result ${e.result}">${resKor}</div>
          <div class="entry-date">${dateStr}</div>
        </div>
        <div class="entry-rr ${rrClass}">${rrStr} RR</div>
        <div class="entry-note">${e.note || '—'}</div>
        <button class="entry-del" onclick="deleteEntry(${e.id})">✕</button>
      </div>`;
  }).join('');
}

function drawChart() {
  const canvas = document.getElementById('rr-chart');
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.offsetWidth || 800;
  canvas.height = 120;

  const sorted = [...entries].reverse();
  let cum = 0;
  const points = sorted.map(e => { cum += (e.rr||0); return cum; });

  const min = Math.min(...points, 0);
  const max = Math.max(...points, 1);
  const range = max - min || 1;
  const W = canvas.width, H = 100;
  const pad = 10;

  ctx.clearRect(0, 0, W, canvas.height);

  // 선
  ctx.beginPath();
  ctx.strokeStyle = '#ff4655';
  ctx.lineWidth = 2;
  points.forEach((p, i) => {
    const x = pad + (i / (points.length-1||1)) * (W - pad*2);
    const y = pad + (1 - (p - min) / range) * (H - pad*2);
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  });
  ctx.stroke();

  // 점
  points.forEach((p, i) => {
    const x = pad + (i / (points.length-1||1)) * (W - pad*2);
    const y = pad + (1 - (p - min) / range) * (H - pad*2);
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI*2);
    ctx.fillStyle = p >= 0 ? '#4ade80' : '#ff4655';
    ctx.fill();
  });
}

// 날짜 기본값 오늘
document.getElementById('d-date').valueAsDate = new Date();

// 초기 렌더링
renderLineupChips();

renderComp();
renderRanked();
